*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:520px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}.top{padding:25px 24px 10px;display:flex;justify-content:space-between;align-items:center}.brand{letter-spacing:.19em;font-weight:800;font-size:14px}.brand em{color:var(--lime);font-style:normal}.iconbtn{background:var(--surface);border:1px solid var(--line);width:42px;height:42px;border-radius:14px;color:var(--txt);font-size:20px}.view{flex:1;overflow:auto;overscroll-behavior:contain;padding:14px 24px 25px;scrollbar-width:none}.view::-webkit-scrollbar{display:none}.eyebrow{font-size:12px;color:var(--muted);font-weight:650;letter-spacing:.1em;text-transform:uppercase}.hero h1{font-size:37px;line-height:1.04;letter-spacing:-.055em;margin:12px 0 10px;font-weight:750}.hero p{color:var(--muted);font-size:14px;line-height:1.5;margin:0}.stats{margin:25px 0 24px;background:linear-gradient(145deg,#1d2922,#17201b);border:1px solid #314532;border-radius:25px;padding:22px}.statline{display:flex;justify-content:space-between;align-items:center}.statline strong{font-size:40px;letter-spacing:-.05em}.statline small{font-size:13px;color:#bdd3b2}.meter{height:6px;border-radius:8px;background:#344235;margin-top:19px;overflow:hidden}.meter div{background:var(--lime);height:100%;border-radius:8px;transition:width .2s}.stats .sub{margin-top:11px;font-size:12px;color:#b6c2b6}.section-head{display:flex;justify-content:space-between;align-items:center;margin:23px 0 12px}.section-head h2{margin:0;font-size:17px;letter-spacing:-.02em}.section-head span{color:var(--muted);font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.action{min-height:134px;border:1px solid var(--line);border-radius:23px;backgroun border-radius:17px;padding:16px}.tip strong{font-size:14px}.tip p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.onboard-progress{display:flex;gap:5px;margin:20px 0}.onboard-progress span{height:5px;flex:1;border-radius:4px;background:#343e39}.onboard-progress span.active{background:var(--lime)}
a{color:var(--lime)}summary{cursor:pointer;font-size:14px;font-weight:650;min-height:28px}h2{font-size:18px}.calorie-range{font-size:27px;letter-spacing:-.04em}.calorie-range small{font-size:12px;color:var(--muted);font-weight:400}.workout-list{list-style:none;padding:0}.workout-list li{padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.workout-list span{display:block;color:var(--muted);margin-top:5px}.chip.selected{border-color:var(--lime);color:var(--lime)}:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
