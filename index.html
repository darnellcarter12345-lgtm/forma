<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0b0e10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>FORMA — Food, simplified</title>
<style>
:root{color-scheme:dark;--bg:#0b0e10;--surface:#151a1d;--soft:#1e2427;--line:#2b3236;--txt:#f6f7f5;--muted:#9ca7a7;--lime:#c8f774;--red:#f2a6a6;--radius:22px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:520px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}.top{padding:25px 24px 10px;display:flex;justify-content:space-between;align-items:center}.brand{letter-spacing:.19em;font-weight:800;font-size:14px}.brand em{color:var(--lime);font-style:normal}.iconbtn{background:var(--surface);border:1px solid var(--line);width:42px;height:42px;border-radius:14px;color:var(--txt);font-size:20px}.view{flex:1;overflow:auto;overscroll-behavior:contain;padding:14px 24px 25px;scrollbar-width:none}.view::-webkit-scrollbar{display:none}.eyebrow{font-size:12px;color:var(--muted);font-weight:650;letter-spacing:.1em;text-transform:uppercase}.hero h1{font-size:37px;line-height:1.04;letter-spacing:-.055em;margin:12px 0 10px;font-weight:750}.hero p{color:var(--muted);font-size:14px;line-height:1.5;margin:0}.stats{margin:25px 0 24px;background:linear-gradient(145deg,#1d2922,#17201b);border:1px solid #314532;border-radius:25px;padding:22px}.statline{display:flex;justify-content:space-between;align-items:center}.statline strong{font-size:40px;letter-spacing:-.05em}.statline small{font-size:13px;color:#bdd3b2}.meter{height:6px;border-radius:8px;background:#344235;margin-top:19px;overflow:hidden}.meter div{background:var(--lime);height:100%;border-radius:8px;transition:width .2s}.stats .sub{margin-top:11px;font-size:12px;color:#b6c2b6}.section-head{display:flex;justify-content:space-between;align-items:center;margin:23px 0 12px}.section-head h2{margin:0;font-size:17px;letter-spacing:-.02em}.section-head span{color:var(--muted);font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.action{min-height:134px;border:1px solid var(--line);border-radius:23px;background:var(--surface);color:var(--txt);padding:17px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}.action .glyph{font-size:27px}.action strong{display:block;font-size:16px}.action small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.entry{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.entry .symbol{width:44px;height:44px;flex:none;background:var(--soft);border-radius:15px;display:grid;place-items:center;font-size:21px}.entry .details{min-width:0;flex:1}.entry strong{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry small{color:var(--muted);font-size:12px;display:block;margin-top:5px}.entry .cal{font-size:14px;font-weight:650;white-space:nowrap}.entry .del{border:0;background:none;color:var(--muted);font-size:19px;padding:5px}.empty{color:var(--muted);font-size:13px;line-height:1.55;padding:16px 0}.nav{border-top:1px solid var(--line);background:#0e1214;display:flex;padding:12px 17px 7px;gap:8px}.nav button{border:0;color:var(--muted);background:none;border-radius:14px;flex:1;min-height:52px;font-size:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}.nav button b{font-size:22px;font-weight:400}.nav button.active{color:var(--lime);background:#202a20}.pill{display:inline-block;border-radius:100px;padding:7px 11px;background:#263425;color:var(--lime);font-size:11px;font-weight:700}.page-title{margin:9px 0 7px;font-size:32px;letter-spacing:-.04em}.muted{color:var(--muted);font-size:13px;line-height:1.55}.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:19px;margin:18px 0}.field{margin:16px 0}.field label{font-size:12px;color:var(--muted);font-weight:650;display:block;margin-bottom:8px}.field input,.field select{width:100%;border-radius:13px;border:1px solid #374045;background:#20272a;color:var(--txt);padding:14px 13px;outline:none;min-height:48px}.field input:focus,.field select:focus{border-color:var(--lime)}.split{display:grid;grid-template-columns:1fr 1fr;gap:11px}.primary{background:var(--lime);border:0;color:#18200f;border-radius:15px;font-weight:750;padding:15px;width:100%;min-height:50px}.secondary{background:#242b2d;border:1px solid #384045;border-radius:15px;color:var(--txt);font-weight:650;padding:13px;width:100%;min-height:48px}.fine{font-size:11px;line-height:1.5;color:var(--muted)}.notice{border-radius:13px;background:#2b2a20;color:#e7d7a5;padding:12px;font-size:12px;line-height:1.5;margin:12px 0}.success{color:var(--lime)}.error{color:var(--red)}.hidden{display:none!important}.camera{width:100%;border-radius:20px;max-height:260px;object-fit:cover;background:#000}.preview{width:100%;max-height:260px;object-fit:contain;background:#111;border-radius:18px}.camera-box{position:relative}.scanline{position:absolute;left:12%;right:12%;top:47%;border-top:2px solid var(--lime);box-shadow:0 0 15px var(--lime)}.back{border:0;background:none;color:var(--muted);padding:8px 0 4px;font-size:14px}.loading{opacity:.75}.footer-space{height:12px}.choice-grid{display:grid;gap:9px;margin:14px 0}.choice{width:100%;text-align:left;background:#20272a;border:1px solid #374045;border-radius:15px;color:var(--txt);padding:15px;line-height:1.4}.choice strong{display:block;font-size:14px}.choice small{color:var(--muted);display:block;margin-top:4px;font-size:12px}.choice.selected{border-color:var(--lime);background:#263326}.guide-card{background:#1c2820;border:1px solid #344d38;border-radius:22px;padding:20px;margin:18px 0}.guide-card h2{font-size:18px;margin:8px 0}.guide-card p{color:#cbd7c8;font-size:13px;line-height:1.55}.guide-card .eyebrow{color:var(--lime)}.chip{border:1px solid #46504a;background:#252d29;color:#ecf4e5;padding:9px 12px;border-radius:100px;font-size:12px}.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0}.tips{display:grid;gap:11px;margin:17px 0}.tip{border:1px solid var(--line);background:var(--surface);border-radius:17px;padding:16px}.tip strong{font-size:14px}.tip p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.onboard-progress{display:flex;gap:5px;margin:20px 0}.onboard-progress span{height:5px;flex:1;border-radius:4px;background:#343e39}.onboard-progress span.active{background:var(--lime)}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">F<em>O</em>RMA<span style="color:#77847b">.</span></div><button id="settingsBtn" class="iconbtn" aria-label="Settings">⚙</button></header>
<main id="view" class="view"></main>
<nav class="nav" aria-label="Main navigation"><button data-page="home" class="active"><b>⌂</b>Today</button><button data-page="scan"><b>◎</b>Scan</button><button data-page="history"><b>▤</b>History</button><button data-page="profile"><b>◯</b>Profile</button></nav>
</div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<script>
'use strict';
const $=s=>document.querySelector(s), view=$('#view');
const KEY='forma_v1', DEFAULT={profile:{height:'',weight:'',unit:'lb',focus:'balanced'},entries:[],worker:'',setup:{done:false,goal:'balanced',support:'simple',challenge:'ideas'}};
let state;try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');state={...DEFAULT,...saved,profile:{...DEFAULT.profile,...(saved?.profile||{})},entries:Array.isArray(saved?.entries)?saved.entries:[],setup:{...DEFAULT.setup,...(saved?.setup||{})}}}catch{state=structuredClone(DEFAULT)}
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');const dayOf=x=>new Date(x).toLocaleDateString('en-CA');
const fmtDate=x=>new Date(x).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const kcal=n=>Math.round(Number(n)||0);const todayEntries=()=>state.entries.filter(e=>dayOf(e.at)===today());
let page=state.setup.done?'home':'welcome', setupStep=0, stream=null, detectorLoop=false, activeImage=null, aiEstimate=null;
function stopCamera(){detectorLoop=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function nav(p){if(!state.setup.done&&p!=='welcome')p='welcome';if(p==='welcome')setupStep=0;stopCamera();page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();view.scrollTop=0}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));$('#settingsBtn').onclick=()=>nav('settings');
function render(){document.querySelector('.nav').classList.toggle('hidden',page==='welcome');$('#settingsBtn').classList.toggle('hidden',page==='welcome');const pages={home:homeHTML,scan:scanHTML,history:historyHTML,profile:profileHTML,settings:settingsHTML,welcome:welcomeHTML,guide:guideHTML,photo:photoHTML,barcode:barcodeHTML,manual:manualHTML};view.innerHTML=(pages[page]||homeHTML)();bindPage()}
function homeHTML(){let entries=todayEntries(),total=entries.reduce((a,e)=>a+e.calories,0);return `<div class="hero"><span class="pill">YOUR DAILY COMPANION</span><h1>Eat well.<br>Stay in tune.</h1><p>Recognize food, understand portions, and keep your meals in one simple place.</p></div><div class="stats"><div class="eyebrow" style="color:#bdd3b2">TODAY'S ESTIMATE</div><div class="statline"><strong>${total.toLocaleString()}</strong><small>kcal logged</small></div><div class="meter"><div style="width:${Math.min(100,entries.length*17)}%"></div></div><div class="sub">${entries.length} food ${entries.length===1?'entry':'entries'} · Counts are estimates, not targets</div></div><div class="guide-card"><span class="eyebrow">YOUR HEALTH GUIDE</span><h2>${esc(goalHeading())}</h2><p>${esc(dailyInsight())}</p><button class="secondary" data-go="guide">See my suggestions →</button></div><div class="section-head"><h2>Quick add</h2></div><div class="actions"><button class="action" data-go="photo"><span class="glyph">▧</span><span><strong>Scan food</strong><small>Take or upload a photo</small></span></button><button class="action" data-go="barcode"><span class="glyph">▥</span><span><strong>Scan barcode</strong><small>Look up packaged food</small></span></button></div><div class="section-head"><h2>Today's food</h2><span>${entries.length} logged</span></div>${entries.length?entries.slice().reverse().map(entryHTML).join(''):'<p class="empty">No food logged yet. Scan a meal or a package to get started.</p>'}<div class="footer-space"></div>`}
function entryHTML(e){return `<div class="entry"><span class="symbol">${e.emoji||'◈'}</span><div class="details"><strong>${esc(e.name)}</strong><small>${esc(e.serving||'Estimated portion')} · ${new Date(e.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</small></div><span class="cal">${kcal(e.calories)} kcal</span><button class="del" data-delete="${esc(e.id)}" aria-label="Remove food">×</button></div>`}
function scanHTML(){return `<div class="eyebrow">QUICK SCAN</div><h1 class="page-title">What are you eating?</h1><p class="muted">Two fast ways to get a calorie estimate.</p><div class="actions" style="margin-top:27px"><button class="action" data-go="photo"><span class="glyph">▧</span><span><strong>Food photo</strong><small>AI estimate or manual entry</small></span></button><button class="action" data-go="barcode"><span class="glyph">▥</span><span><strong>Barcode</strong><small>Packaged nutrition facts</small></span></button></div><div class="panel"><div class="eyebrow">NO CAMERA?</div><p class="muted">You can also enter a food or barcode yourself.</p><button class="secondary" data-go="manual">Add food manually</button></div>`}
function historyHTML(){const grouped={};state.entries.slice().reverse().forEach(e=>(grouped[dayOf(e.at)]??=[]).push(e));return `<div class="eyebrow">YOUR LOG</div><h1 class="page-title">History</h1><p class="muted">A simple record, with no streaks or pressure.</p>${Object.keys(grouped).sort().reverse().map(d=>`<div class="section-head"><h2>${d===today()?'Today':fmtDate(d+'T12:00:00')}</h2><span>${grouped[d].reduce((a,e)=>a+e.calories,0).toLocaleString()} kcal estimated</span></div>${grouped[d].map(entryHTML).join('')}`).join('')||'<p class="empty">Your food log will appear here as you add meals.</p>'}`}
function profileHTML(){const p=state.profile;return `<div class="eyebrow">PERSONALIZE</div><h1 class="page-title">Your profile</h1><p class="muted">Keep your details and choose what you want the app to support. There are no restrictive calorie goals.</p><form id="profileForm" class="panel"><div class="split"><div class="field"><label for="height">Height (cm)</label><input id="height" type="number" min="50" max="250" step="0.1" placeholder="Optional" value="${esc(p.height)}"></div><div class="field"><label for="weight">Weight</label><input id="weight" type="number" min="1" max="900" step="0.1" placeholder="Optional" value="${esc(p.weight)}"></div></div><div class="field"><label for="unit">Weight units</label><select id="unit"><option value="lb" ${p.unit==='lb'?'selected':''}>Pounds (lb)</option><option value="kg" ${p.unit==='kg'?'selected':''}>Kilograms (kg)</option></select></div><div class="field"><label for="focus">What would you like help with?</label><select id="focus"><option value="balanced" ${p.focus==='balanced'?'selected':''}>Balanced meals</option><option value="fuel" ${p.focus==='fuel'?'selected':''}>Fueling workouts and activity</option><option value="protein" ${p.focus==='protein'?'selected':''}>Understanding protein and nutrients</option><option value="mindful" ${p.focus==='mindful'?'selected':''}>Building consistent habits</option></select></div><button class="primary" type="submit">Save profile</button><p class="fine">Your measurements stay on this device. They aren't used to calculate weight-loss targets or judge your body.</p></form><button class="secondary" data-go="welcome">Redo personal check-in</button><div class="panel"><strong>Your focus</strong><p class="muted">${{balanced:'Include a variety of foods, enjoy meals, and pay attention to how you feel.',fuel:'Regular meals and snacks help support activity, training, and recovery.',protein:'Learn what foods contain protein and other nutrients without rigid daily quotas.',mindful:'Build flexible habits that fit everyday life.'}[p.focus]}</p></div>`}
const GOALS={balanced:['Eat more balanced meals','Build flexible, satisfying meals'],fuel:['Feel fueled and energized','Support everyday activity and recovery'],protein:['Understand my nutrition','Learn about nutrients without rigid rules'],mindful:['Build an easier routine','Make food choices feel more manageable']};
const SUPPORT={simple:'Just the essentials',guided:'A little extra guidance',more:'More encouragement and ideas'};
const CHALLENGES={ideas:'I need meal ideas',routine:'I forget to eat regularly',labels:'Nutrition labels confuse me',energy:'I want better energy',unsure:'Not sure yet'};
function goalHeading(){return (GOALS[state.setup.goal]||GOALS.balanced)[0]}
function dailyInsight(){const n=todayEntries().length,g=state.setup.goal;if(!n)return g==='fuel'?'Start with a meal or snack that helps you feel ready for your day.':g==='protein'?'Scan a food to learn about it, without needing to hit a number.':'A simple first step: add a meal whenever it feels useful.';if(n===1)return 'You have one meal logged. Remember that a food log is only a partial picture of nutrition.';return 'You have added '+n+' foods today. Focus on how meals support energy, satisfaction, and your routine.'}
function guideTips(){const g=state.setup.goal,c=state.setup.challenge,s=state.setup.support;const tips=[];
if(g==='fuel')tips.push(['Fuel around activity','Meals and snacks that include carbohydrates and protein can support your energy and recovery.']);
if(g==='protein')tips.push(['Think beyond calories','Protein, carbohydrates, fats, fiber and micronutrients all matter. A barcode can be a starting point, not the full story.']);
if(g==='mindful')tips.push(['Make it low-pressure','A helpful routine can be as simple as checking whether you have had enough time to eat, rest and enjoy your meals.']);
if(g==='balanced')tips.push(['Mix what you enjoy','When possible, combine foods you like with produce, a satisfying carbohydrate, and a protein source. No meal needs to be perfect.']);
if(c==='ideas')tips.push(['Easy meal idea','Try a sandwich or rice bowl with your choice of filling and a fruit or vegetable on the side.']);
if(c==='routine')tips.push(['Create a practical cue','Connect meals or snacks to familiar parts of your day, like before school, between activities, or after a workout.']);
if(c==='labels')tips.push(['Reading a label','Check serving size first. Calories describe energy, but the ingredient list and nutrients can provide useful context too.']);
if(c==='energy')tips.push(['Notice your energy','Regular food, water, sleep and recovery all affect how energetic you feel.']);
if(c==='unsure')tips.push(['Start small','Choose one useful habit to practice rather than changing everything at once.']);
if(s!=='simple')tips.push(['Review your day gently','Think about what worked for you today and one thing that might make tomorrow easier.']);
if(s==='more')tips.push(['Ask for extra support when needed','A registered dietitian or healthcare professional can help personalize nutrition advice, especially with health concerns.']);
return tips;}
function welcomeHTML(){const progress='<div class="onboard-progress">'+[0,1,2].map(n=>'<span class="'+(n<=setupStep?'active':'')+'"></span>').join('')+'</div>';
const title=['What brings you here?','How much help would you like?','What feels hardest right now?'][setupStep];const sub=['Choose what you want FORMA to help with. You can change this later.','Keep your experience as simple or as supportive as you prefer.','This helps make the suggestions more useful.'][setupStep];const options=setupStep===0?Object.entries(GOALS).map(([v,t])=>[v,t[0],t[1]]):setupStep===1?Object.entries(SUPPORT).map(([v,t])=>[v,t,'']):Object.entries(CHALLENGES).map(([v,t])=>[v,t,'']);const key=['goal','support','challenge'][setupStep];return `<div class="eyebrow">FORMA · PERSONAL CHECK-IN</div>${progress}<h1 class="page-title">${title}</h1><p class="muted">${sub}</p><div class="choice-grid">${options.map(([v,t,d])=>`<button class="choice ${state.setup[key]===v?'selected':''}" data-choice="${v}"><strong>${esc(t)}</strong>${d?`<small>${esc(d)}</small>`:''}</button>`).join('')}</div><button id="nextSetup" class="primary">${setupStep===2?'Start using FORMA':'Continue'}</button>${setupStep>0?'<button class="back" id="prevSetup">← Back</button>':''}<p class="fine">Your answers stay on this device. FORMA offers general wellness suggestions, not medical diagnoses, restrictive calorie targets, or treatment plans.</p>`}
function guideHTML(){const tips=guideTips();return `<div class="eyebrow">PERSONAL HEALTH GUIDE</div><h1 class="page-title">Here for your goals.</h1><p class="muted">Based on your check-in, here are a few practical ideas. No scores, strict targets, or pressure.</p><div class="guide-card"><span class="eyebrow">CURRENT FOCUS</span><h2>${esc(goalHeading())}</h2><p>${esc(dailyInsight())}</p></div><div class="section-head"><h2>Ideas for you</h2><span>${tips.length} suggestions</span></div><div class="tips">${tips.map(([h,t])=>`<div class="tip"><strong>${esc(h)}</strong><p>${esc(t)}</p></div>`).join('')}</div><button class="secondary" data-go="welcome">Update my check-in</button><p class="fine">This guide uses simple preset advice matched to your answers, not a live AI conversation. For individualized health or nutrition needs, consult a qualified healthcare professional.</p>`}
function settingsHTML(){return `<div class="eyebrow">PREFERENCES</div><h1 class="page-title">Settings</h1><div class="panel"><strong>Food photo AI</strong><p class="muted">For actual automatic picture recognition, connect an AI-capable Cloudflare Worker. Your API key should stay in the Worker, never in this page.</p><div class="field"><label for="worker">Worker HTTPS endpoint</label><input id="worker" type="url" placeholder="https://your-worker.workers.dev/analyze" value="${esc(state.worker)}"></div><button class="secondary" id="saveWorker">Save AI connection</button><p class="fine">The Worker must accept POST JSON {image: data URL} and return {name, calories, serving, confidence}. An example Worker is included with this app.</p></div><div class="panel"><strong>Privacy and data</strong><p class="muted">Food history and profile are stored on this device. Food images go only to the AI endpoint you configure. Barcodes are looked up with Open Food Facts.</p><button class="secondary" id="clearHistory">Clear food history</button></div>`}
function photoHTML(){return `<button class="back" data-go="scan">‹ Back</button><div class="eyebrow">FOOD PHOTO</div><h1 class="page-title">Scan your meal</h1><p class="muted">Take a clear photo of the food. Any result is an estimate that you can edit.</p><div class="panel"><button class="primary" id="choosePhoto">Take or choose photo</button><div id="photoArea" style="margin-top:14px">${activeImage?`<img class="preview" src="${activeImage}" alt="Selected food">`:''}</div><div id="photoResult" style="margin-top:12px"></div>${activeImage?'<button class="secondary" id="analyzePhoto" style="margin-top:10px">Estimate from photo</button>':''}</div><p class="fine">Without an AI connection, the photo will not be recognized automatically. You can still add the food manually.</p><button class="secondary" data-go="manual">Enter food instead</button>`}
function barcodeHTML(){return `<button class="back" data-go="scan">‹ Back</button><div class="eyebrow">BARCODE SCANNER</div><h1 class="page-title">Scan a package</h1><p class="muted">Point your camera at a barcode or type its numbers below.</p><div class="panel"><div id="videoWrap" class="camera-box hidden"><video id="camera" class="camera" autoplay playsinline muted></video><div class="scanline"></div></div><button id="startCamera" class="primary">Open barcode camera</button><p id="cameraMessage" class="fine"></p><div class="field"><label for="barcodeInput">Barcode number</label><input id="barcodeInput" type="text" inputmode="numeric" placeholder="e.g. 3017620422003"></div><button class="secondary" id="lookUp">Find food</button><div id="barcodeResult"></div></div><p class="fine">Uses Open Food Facts, a community-maintained database. Always verify the label; some products are missing or have outdated entries.</p>`}
function manualHTML(){return `<button class="back" data-go="scan">‹ Back</button><div class="eyebrow">ADD FOOD</div><h1 class="page-title">Food details</h1><p class="muted">Adjust the serving and estimated nutrition to match what you had.</p><form id="manualForm" class="panel"><div class="field"><label for="foodName">Food name</label><input id="foodName" required placeholder="e.g. Rice and chicken" maxlength="100" value="${esc(aiEstimate?.name||'')}"></div><div class="field"><label for="foodServing">Serving / amount</label><input id="foodServing" placeholder="e.g. 1 bowl, about 350 g" maxlength="80" value="${esc(aiEstimate?.serving||'')}"></div><div class="field"><label for="foodCals">Calories (estimated)</label><input id="foodCals" required type="number" min="0" max="20000" step="1" placeholder="Check package or recipe" value="${aiEstimate?.calories??''}"></div><button class="primary" type="submit">Add to today</button></form><p class="fine">Calorie values vary with preparation and portion size. These figures are informational, not a daily limit.</p>`}
function bindPage(){if(page==='welcome'){view.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.setup[['goal','support','challenge'][setupStep]]=b.dataset.choice;save();render()});$('#nextSetup').onclick=()=>{if(setupStep<2){setupStep++;render()}else{state.setup.done=true;state.profile.focus=state.setup.goal;save();nav('home')}};$('#prevSetup')?.addEventListener('click',()=>{setupStep--;render()})}view.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));view.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{state.entries=state.entries.filter(e=>e.id!==b.dataset.delete);save();render()});
if(page==='profile')$('#profileForm').onsubmit=e=>{e.preventDefault();state.profile={height:$('#height').value,weight:$('#weight').value,unit:$('#unit').value,focus:$('#focus').value};state.setup.goal=state.profile.focus;save();render();};
if(page==='settings'){$('#saveWorker').onclick=()=>{const val=$('#worker').value.trim();if(val && !/^https:\/\//i.test(val)){alert('Use an HTTPS URL.');return}state.worker=val;save();alert('Saved.');};$('#clearHistory').onclick=()=>{if(confirm('Delete all food entries on this device?')){state.entries=[];save();render()}}}
if(page==='photo'){const choose=$('#choosePhoto');choose.onclick=()=>$('#photoInput').click();$('#analyzePhoto')?.addEventListener('click',analyzePhoto)}
if(page==='barcode'){$('#startCamera').onclick=startBarcodeCamera;$('#lookUp').onclick=()=>lookupBarcode($('#barcodeInput').value.trim())}
if(page==='manual'){$('#manualForm').onsubmit=e=>{e.preventDefault();const name=$('#foodName').value.trim(),cal=Number($('#foodCals').value);if(!name||!Number.isFinite(cal)||cal<0)return;state.entries.push({id:crypto.randomUUID?.()||String(Date.now()),name,serving:$('#foodServing').value.trim()||'1 portion',calories:kcal(cal),at:new Date().toISOString(),emoji:'◈'});save();aiEstimate=null;nav('home')}}}
$('#photoInput').onchange=async e=>{let file=e.target.files?.[0];if(!file)return;if(file.size>20e6){alert('Please choose an image under 20 MB');return}try{activeImage=await resizeImage(file);nav('photo')}catch(err){alert('Could not read this image')}e.target.value=''};
function resizeImage(file){return new Promise((resolve,reject)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,1200/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=()=>{URL.revokeObjectURL(u);reject()};img.src=u})}
async function analyzePhoto(){if(!state.worker){$('#photoResult').innerHTML='<div class="notice">Automatic photo recognition needs an AI connection. Open Settings to add your Worker, or enter the food details yourself.</div>';return}const btn=$('#analyzePhoto');btn.disabled=true;btn.textContent='Estimating…';try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),25000);const r=await fetch(state.worker,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:activeImage}),signal:controller.signal});clearTimeout(timer);if(!r.ok)throw Error('Service returned '+r.status);const d=await r.json();if(!d.name||!Number.isFinite(Number(d.calories)))throw Error('Invalid AI response');aiEstimate={name:String(d.name).slice(0,100),serving:String(d.serving||'1 estimated portion').slice(0,80),calories:kcal(d.calories)};$('#photoResult').innerHTML=`<div class="notice">Estimated: <strong>${esc(aiEstimate.name)}</strong> · ${kcal(aiEstimate.calories)} kcal. Check the portion before saving.</div><button class="primary" id="reviewPhoto">Review and add</button>`;$('#reviewPhoto').onclick=()=>nav('manual')}catch(e){$('#photoResult').innerHTML=`<div class="notice">Could not estimate this photo: ${esc(e.message)}. You can add the food manually.</div>`}finally{btn.disabled=false;btn.textContent='Estimate from photo'}}
async function startBarcodeCamera(){const msg=$('#cameraMessage');if(!navigator.mediaDevices?.getUserMedia){msg.textContent='Camera is unavailable in this browser. Enter the barcode manually.';return}if(!('BarcodeDetector' in window)){msg.textContent='This browser does not support live barcode detection. Type the barcode below or try Chrome on Android.';return}try{const formats=await BarcodeDetector.getSupportedFormats();const usable=['ean_13','ean_8','upc_a','upc_e','code_128'].filter(x=>formats.includes(x));if(!usable.length)throw Error('Barcode formats unavailable');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('#videoWrap').classList.remove('hidden');const v=$('#camera');v.srcObject=stream;await v.play();$('#startCamera').textContent='Camera scanning…';$('#startCamera').disabled=true;msg.textContent='Keep the barcode in view.';detectorLoop=true;const det=new BarcodeDetector({formats:usable});while(detectorLoop&&stream){try{const codes=await det.detect(v);if(codes.length){const code=codes[0].rawValue;stopCamera();$('#barcodeInput').value=code;msg.textContent='Barcode found: '+code;await lookupBarcode(code);break}}catch{}await new Promise(res=>setTimeout(res,230))}}catch(e){stopCamera();msg.textContent='Camera unavailable: '+e.message+'. Enter the barcode below instead.';$('#startCamera').disabled=false}}
async function lookupBarcode(raw){const code=raw.replace(/\s/g,'');const box=$('#barcodeResult');if(!/^\d{8,14}$/.test(code)){box.innerHTML='<p class="error">Enter an 8–14 digit barcode.</p>';return}stopCamera();box.innerHTML='<p class="muted">Looking up this product…</p>';try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,brands,quantity,serving_size,nutriments,status',{headers:{Accept:'application/json'}});if(!r.ok)throw Error('Lookup failed');const d=await r.json();if(d.status!==1||!d.product)throw Error('Product not found');const p=d.product;const name=(p.product_name||p.brands||'Unnamed food').trim(),n=p.nutriments||{};let calories=Number(n['energy-kcal_serving']);let serving=p.serving_size||'';if(!Number.isFinite(calories)||calories<0){calories=Number(n['energy-kcal_100g']);serving='100 g'}if(!Number.isFinite(calories)||calories<0)throw Error('Product found, but calories are missing');aiEstimate={name,serving:serving||'One listed serving',calories:kcal(calories)};box.innerHTML=`<div class="panel" style="margin-bottom:0"><strong>${esc(name)}</strong><p class="muted">${esc(p.brands||'')} · ${esc(aiEstimate.serving)}</p><div style="font-size:30px;font-weight:750;margin:13px 0">${aiEstimate.calories} <small style="font-size:14px;color:var(--muted)">kcal</small></div><button class="primary" id="reviewProduct">Review and add</button></div>`;$('#reviewProduct').onclick=()=>nav('manual')}catch(e){box.innerHTML=`<div class="notice">${esc(e.message)}. Check the package label and add it manually.</div><button class="secondary" id="manualFallback">Add manually</button>`;$('#manualFallback').onclick=()=>nav('manual')}}
render();
</script>
</body>
</html>
